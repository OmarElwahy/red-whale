# RED WHALE lab (lab/README.md). What an active tool should find here:
#   http://lab.redwhale.test/   301 to https://elsewhere.redwhale.test/ (another host: tools must NOT follow it)
#   https://lab.redwhale.test/  200, title "Northwind Lab": the start of a small crawlable site (lab/site/, for katana):
#                               links to products/about (and on to item, then deep: 3 links from home), a script
#                               naming /api/v1/orders, a stylesheet, an image (404), a PDF, robots.txt and
#                               sitemap.xml (which alone links contact.html), the http:// 301 above and
#                               https://elsewhere.redwhale.test/partners.html (another host: a crawler must not go there)
#   https://lab.redwhale.test/.git/config and /.env  200, text/plain, OBVIOUSLY FAKE contents (for nuclei's git-config
#                               and laravel-env exposure templates); linked from nowhere
#   https://lab.redwhale.test/waf/  a FAKE WAF for wafw00f: 200, but 403 "Request forbidden by administrative rules"
#                               when the query string has an attack-looking test string; linked from nowhere
#   http://lab.redwhale.test:8080/  200, plain text "redwhale lab 8080" (a port only a port scanner finds)
#   all: Server: nginx/<version> and X-Powered-By: PHP/8.3.12 (for tech detection)
#   lab.redwhale.test:22  a fake SSH banner "SSH-2.0-OpenSSH_9.6p1", then the connection closes (for nmap -sV).
#                         There is NO real SSH here: no key exchange, no login, nothing behind the banner.
# The access log records the Host of every request, so a followed redirect shows up as host=elsewhere.redwhale.test.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

# TCP 22: only a banner. nginx's stream `return` sends the string and closes; no SSH server runs in the lab.
stream {
  log_format ssh 'ssh $remote_addr $status $bytes_sent';
  access_log /dev/stdout ssh;

  server {
    listen 22;
    return "SSH-2.0-OpenSSH_9.6p1\r\n";
  }
}

http {
  log_format lab 'host=$host $remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout lab;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  default_type text/html;
  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/xml xml;
    text/plain txt;
    application/pdf pdf;
  }
  server_tokens on;
  add_header X-Powered-By "PHP/8.3.12" always;

  server {
    listen 80 default_server;
    server_name _;
    location = / {
      return 301 https://elsewhere.redwhale.test/;
    }
    location / {
      return 404;
    }
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/lab/cert.pem;
    ssl_certificate_key /etc/nginx/lab/key.pem;
    root /usr/share/nginx/lab;
    index index.html;
    location = /api/v1/orders {
      default_type application/json;
      return 200 '{"orders":[]}\n';
    }
    # Fake exposed files for nuclei's exposure templates (git-config, laravel-env). Served from here, not lab/site/
    # (git never tracks a path named .git). OBVIOUSLY FAKE: no real credential, key or host is in them. Linked from
    # nowhere, so a crawler never finds them; text/plain (laravel-env skips HTML).
    location = /.git/config {
      default_type text/plain;
      return 200 "[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = false\n[remote \"origin\"]\n\turl = https://redwhale-lab:fake-not-a-secret@git.redwhale.test/northwind/site.git\n\tfetch = +refs/heads/*:refs/remotes/origin/*\n";
    }
    location = /.env {
      default_type text/plain;
      return 200 "# RED WHALE lab: FAKE values for nuclei's exposure templates. Nothing here is a real secret.\nAPP_NAME=NorthwindLab\nAPP_ENV=lab\nAPP_KEY=redwhale-lab-fake-app-key\nDB_HOST=db.redwhale.test\nDB_PASSWORD=redwhale-lab-fake-password\n";
    }
    # A FAKE WAF for wafw00f, on this one path only (the rest of the lab has no WAF): a query string with an
    # attack-looking test string (encoded <script, UNION SELECT, ../etc/passwd) gets a 403 whose body has
    # "<h1>403 Forbidden</h1>" and "Request forbidden by administrative rules", the two things wafw00f's
    # "Shadow Daemon (Zecure)" signature looks for. The page names only the lab, no real vendor. Linked from nowhere.
    location = /waf/ {
      add_header X-Powered-By "PHP/8.3.12" always;
      if ($args ~* "(%3Cscript|union(\+|%20)select|etc%2Fpasswd)") {
        add_header X-Powered-By "PHP/8.3.12" always;
        add_header X-RedWhale-Lab-Waf "blocked" always;
        return 403 "<html><head><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1><p>Request forbidden by administrative rules.</p><p>RED WHALE lab WAF (a fake, for wafw00f).</p></body></html>\n";
      }
      return 200 "<html><head><title>Northwind Lab: WAF</title></head><body><p>RED WHALE lab: a page behind a fake WAF.</p></body></html>\n";
    }
    location / {
      try_files $uri $uri/ =404;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    location = / {
      default_type text/plain;
      return 200 "redwhale lab 8080\n";
    }
    location / {
      return 404;
    }
  }
}
