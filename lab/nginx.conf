# RED WHALE lab (lab/README.md). What an active tool should find here:
#   http://lab.redwhale.test/   301 to https://elsewhere.redwhale.test/ (another host: tools must NOT follow it)
#   https://lab.redwhale.test/  200, title "Northwind Lab"
#   http://lab.redwhale.test:8080/  200, plain text "redwhale lab 8080" (a port only a port scanner finds)
#   all: Server: nginx/<version> and X-Powered-By: PHP/8.3.12 (for tech detection)
# The access log records the Host of every request, so a followed redirect shows up as host=elsewhere.redwhale.test.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  log_format lab 'host=$host $remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout lab;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  default_type text/html;
  server_tokens on;
  add_header X-Powered-By "PHP/8.3.12" always;

  server {
    listen 80 default_server;
    server_name _;
    location = / {
      return 301 https://elsewhere.redwhale.test/;
    }
    location / {
      return 404;
    }
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/lab/cert.pem;
    ssl_certificate_key /etc/nginx/lab/key.pem;
    root /usr/share/nginx/lab;
    index index.html;
    location / {
      try_files $uri $uri/ =404;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    location = / {
      default_type text/plain;
      return 200 "redwhale lab 8080\n";
    }
    location / {
      return 404;
    }
  }
}
